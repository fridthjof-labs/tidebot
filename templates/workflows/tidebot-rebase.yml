# Signed rebase for `/rebase`, dispatched by Tidebot.
#
# Required only when `commands.updateBranchMethod` is `signed-rebase`.
# Setup, including the machine user that owns the signing key, is in
# https://github.com/fridthjof-labs/tidebot/blob/main/docs/signed-rebase.md
name: Tidebot rebase

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request to rebase
        required: true
        type: string

jobs:
  rebase:
    # Pinned: this job holds the App key and the signing key, so it must not
    # follow a moving branch.
    uses: fridthjof-labs/tidebot/.github/workflows/signed-rebase.yml@v0.1.0
    with:
      pull_number: ${{ inputs.pull_number }}
      git_user_name: ${{ vars.TIDEBOT_GIT_USER_NAME }}
      git_user_email: ${{ vars.TIDEBOT_GIT_USER_EMAIL }}
    secrets:
      app_id: ${{ secrets.TIDEBOT_APP_ID }}
      private_key: ${{ secrets.TIDEBOT_PRIVATE_KEY }}
      gpg_private_key: ${{ secrets.TIDEBOT_GPG_PRIVATE_KEY }}
      gpg_passphrase: ${{ secrets.TIDEBOT_GPG_PASSPHRASE }}
