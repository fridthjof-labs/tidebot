# Tidebot's own configuration. It runs itself: every change here is exercised
# on the next pull request in this repository.

plugins:
  size: true
  area: true
  commands: true
  tide: true
  stale: true
  dependabot: true
  autoApprove: true
  intake: true

tide:
  mergeMethod: squash
  requiredContexts:
    - Quality / check

area:
  rules:
    - prefix: src/core/
      label: area/core
    - prefix: src/runtime/
      label: area/runtime
    - prefix: src/cli/
      label: area/cli
    - prefix: templates/
      label: area/templates
    - prefix: docs/
      label: area/docs
    - prefix: .github/
      label: area/ci

autoApprove:
  rules:
    - name: docs
      paths: ['**/*.md', LICENSE, .gitignore, .editorconfig]
      requiredContexts:
        - Quality / check

dependabot:
  enabled: true
  autoApprove: true
  requiredContexts:
    - Quality / check
  allowMajorUpdates: false
