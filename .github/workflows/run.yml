# Reusable workflow: run Tidebot once against the event that triggered the
# calling workflow. This is the zero-infrastructure runtime — a repository
# installs one caller workflow and needs no hosted webhook receiver at all.
# Third-party actions are pinned to commit SHAs, not tags: a tag can be moved
# to point at different code, and these jobs may hold an App private key.
# Dependabot updates the pins.
name: Tidebot run

on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Tidebot version to run (tag, branch, or SHA). Defaults to the commit
          of this workflow file, so the caller's `uses:` pin is the only pin.
        required: false
        type: string
        default: ''
    secrets:
      app_id:
        description: Optional App ID used only for branch updates
        required: false
      private_key:
        description: Optional App private key used only for branch updates
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: write
  deployments: read

jobs:
  tidebot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fridthjof-labs/tidebot
          # `job.workflow_sha` is the commit this reusable workflow file was
          # resolved from — the caller's `@<ref>` — so workflow and bot code
          # cannot drift apart, and Dependabot's bump of `uses:` moves both.
          ref: ${{ inputs.ref || job.workflow_sha }}
          path: .tidebot

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: .tidebot/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .tidebot/pnpm-lock.yaml

      - name: Install
        working-directory: .tidebot
        run: pnpm install --frozen-lockfile

      - name: Run Tidebot
        working-directory: .tidebot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIDEBOT_APP_ID: ${{ secrets.app_id }}
          TIDEBOT_PRIVATE_KEY: ${{ secrets.private_key }}
        run: pnpm exec tsx src/cli/index.ts run
