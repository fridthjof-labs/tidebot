name: Quality

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate

  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A known-vulnerable dependency in a bot with write access to thirteen
      # repositories is not a "fix it next sprint" problem.
      - run: pnpm audit --prod
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm types:workers:check
      - run: pnpm test:coverage
      - name: Worker bundles
        run: pnpm exec wrangler deploy --dry-run --env=""
      - name: Preview Worker bundles
        run: pnpm exec wrangler deploy --dry-run --env=preview
