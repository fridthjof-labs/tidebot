name: Release

# Tidebot merges as github-actions[bot], and GitHub does not let a
# GITHUB_TOKEN-authenticated push trigger another workflow's `push` event. A
# Tidebot-merged release PR therefore leaves the tag uncut until the next human
# push to main. Running again after Tidebot finishes on main closes that gap;
# release-please is idempotent and no-ops when there is nothing to release.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Tidebot]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Deploy an existing release tag (e.g. v0.2.1) without cutting a new one
        required: false
        type: string

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Ship the Worker the moment a release exists, or a named tag on dispatch.
  # Checked out at the tag rather than main, so what is deployed is what was
  # released even if main has moved by the time this job runs. Missing
  # CLOUDFLARE_API_TOKEN fails the job loudly: a release that quietly did not
  # deploy is the worse outcome.
  deploy:
    name: deploy
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
